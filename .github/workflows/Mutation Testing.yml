name: Mutation Testing

on:
  push:
    branches:
      - main

jobs:
  mutation-testing:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          cache: true
          cache-dependency-path: "**/packages.lock.json"
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Run mutation testing
        run: |
          cd RaspiFanController
          dotnet stryker \
            --dashboard-api-key "${{ secrets.STRYKER_DASHBOARD_API_KEY }}" \
            --version "${{ github.sha }}" \
            --config-file ../stryker-config.json \
            --output ${{ runner.temp }}/Stryker/

      - name: Archive mutation testing results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-testing-report
          path: ${{ runner.temp }}/Stryker/**/*.*
